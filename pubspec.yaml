name: kimbox_tv
description: "KimBoxTV - 基于 TVBox / FongMi 协议的 Windows PC 桌面影音播放客户端"
publish_to: 'none'
version: 3.18.15+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  window_manager: ^0.3.9
  screen_retriever: ^0.1.9
  flutter_riverpod: ^2.6.1
  dio: ^5.11.1
  crypto: ^3.0.8
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.6
  package_info_plus: ^10.2.1
  media_kit: ^1.2.6
  media_kit_video: ^1.3.1
  media_kit_libs_windows_video: ^1.0.11
  sqlite3: ^2.7.6
  sqlite3_flutter_libs: ^0.5.34
  file_selector: ^1.1.0
  url_launcher: ^6.3.2
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/category-baseline.json
    - assets/category-filter.json
    - assets/icon.png
    - assets/logo.png
